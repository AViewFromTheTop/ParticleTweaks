# Increases the amount of memory Gradle can use and optimizes the GC
	# -XX:+UseZGC
	org.gradle.jvmargs=-Xmx4G
# Helps with build times
	org.gradle.parallel=true
# Caches Dependencies for faster build times.
	org.gradle.caching=true

# Fabric Properties
	# Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
    minecraft_version=26.2
	fabric_loader_version=0.19.3

# Mod Properties
    mod_id = particletweaks
    mod_name = Particle Tweaks
    mod_author = Lunade
    mod_description = Tweaks and improves particles.
	mod_version = 3.0.2
	maven_group = net.lunade
	archives_base_name = ParticleTweaks
	repository = AViewFromTheTop/ParticleTweaks

# Dependencies
    fabric_api_version=0.152.1+26.2
    frozenlib_version=2.5.1-mc26.2
# External Mods
    modmenu_version=20.0.0-beta.2
    cloth_config_version=26.2.155
    wilderwild_version=4.2.10-mc26.2
    trailiertales_version=1.2.6-mc26.2

# Optimization
    sodium_version=mc26.2-0.9.0-fabric
    run_sodium = true

# NeoForge Properties
    neoforge_version=26.2.0.49-beta
    neoforge_loader_version_range=[4,)

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
    neoforge_snapshot_maven=

